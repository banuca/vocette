name: CI

on:
  push:
    branches: [main, go-live]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The checks are platform-independent, but they are run on all three anyway:
  # the keycode table is asserted against the real uiohook-napi enum, and that
  # is a native module with a different prebuild on every host.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx electron-vite build

  # Native-host packaging: each installer is produced on its own operating
  # system and architecture, because the native prebuilds are selected at
  # install time and cannot be cross-built from another host.
  #
  # Nothing is signed here and nothing is published. Signing needs credentials
  # this workflow deliberately does not have; see electron-builder.yml.
  package:
    name: Package (${{ matrix.os }})
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
            artifact: windows
          - os: macos-latest
            script: pack:mac
            artifact: macos
          - os: ubuntu-latest
            script: pack:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main
        run: npx electron-vite build

      - name: Package
        # On CI electron-builder publishes by default, and fails for want of a
        # token. This workflow never publishes: it only builds and uploads.
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Check the native modules survived packaging
        shell: bash
        run: node scripts/check-native-packaging.mjs

      # The Mac app has to carry a valid (ad-hoc) signature on every file, with
      # the microphone entitlement, or Apple silicon will not open it. The DMG's
      # copy is checked too: it is what testers install.
      - name: Check the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d dist/mac-arm64/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dv "$app" 2>&1)
          grep 'Signature=adhoc' <<< "$info"
          grep -E 'flags=.*runtime' <<< "$info"
          entitlements=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          grep -q com.apple.security.device.audio-input <<< "$entitlements"
          find "$app" \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict {} +
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/*-mac-arm64.dmg > /dev/null
          codesign --verify --deep --strict "$mnt"/*.app
          hdiutil detach "$mnt" > /dev/null
          echo "Mac app and DMG are signed (ad-hoc, hardened runtime, microphone entitlement)."

      # The model (935 MB) and two public test recordings, kept between runs.
      # The key changes whenever the app's model manifest does.
      - uses: actions/cache@v4
        with:
          path: .smoke
          key: engine-smoke-${{ hashFiles('src/main/engine/models.ts', 'scripts/engine-smoke.mjs') }}

      - name: Check the on-device engine transcribes in the packaged app
        shell: bash
        run: node scripts/engine-smoke.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vocette-${{ matrix.artifact }}
          # The *.yml and *.blockmap files are what the in-app updater reads; a
          # release without them can never update anyone.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 14

  # A version tag (v0.8.0-beta.1) gathers the three platforms' files into a
  # draft release. A draft is invisible to the public and to the updater; it
  # is published by hand, after its files have been checked (docs/release.md).
  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$(node -p "require('./package.json').version")" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          (cd files && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "Test build. Check a download against SHA256SUMS.txt before installing."
            echo
            echo "- **Windows:** the .exe installer. Unsigned: SmartScreen warns until the app has a certificate."
            echo "- **macOS (Apple silicon):** the .dmg. Not from an identified developer: open it once, then System Settings → Privacy & Security → Open Anyway."
            echo "- **Linux (x64):** the .deb on Ubuntu and Debian. The AppImage needs libfuse2."
            echo
            awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" files/* --draft $prerelease --verify-tag --title "Vocette ${GITHUB_REF_NAME#v}" --notes-file notes.md
