appId: app.vocette
productName: Vocette
copyright: Copyright © 2026 Vocette contributors

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

extraResources:
  - from: resources
    to: resources
    filter:
      - icon.png
      - tray.png

# The native modules must stay outside the asar: koffi, uiohook-napi and the
# speech engine load real files from disk at runtime and cannot be read out of
# an archive. For the speech engine that is the platform package holding
# sherpa-onnx.node and its DLLs (sherpa-onnx-win-x64 and its siblings); with
# nothing unpacked it fails with "Could not find sherpa-onnx-node", the loader
# hiding the real error. Its JavaScript wrapper, sherpa-onnx-node, matches
# too — harmless, and the wrapper finds its sibling by relative path either way.
asarUnpack:
  - '**/node_modules/uiohook-napi/**'
  - '**/node_modules/koffi/**'
  - '**/node_modules/sherpa-onnx-*/**'

# uiohook-napi and koffi ship N-API prebuilds, which are ABI-stable across
# Electron versions and selected at require time. Rebuilding from source would
# need Python and a C++ toolchain for no benefit — but it does mean the
# prebuild for the *target* architecture has to be present, so each platform is
# packaged on its own architecture rather than cross-built.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # Never asks for administrator rights: Vocette installs per user and runs as
  # the user, which is also what keeps its keyboard hook out of elevated apps.
  requestedExecutionLevel: asInvoker
  # Signing: set WIN_CSC_LINK (or CSC_LINK) and CSC_KEY_PASSWORD to a PFX and
  # electron-builder signs the installer and the executable. For a new
  # publisher, Azure Trusted Signing is the better route — see docs/release.md:
  # azureSignOptions:
  #   publisherName: <the name on the Trusted Signing certificate profile>
  #   endpoint: https://<region>.codesigning.azure.net
  #   certificateProfileName: <profile>
  #   codeSigningAccountName: <account>

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vocette
  # The name in Windows' Apps list: the product alone, not the default
  # "Vocette 0.6.0". The version is shown in its own column.
  uninstallDisplayName: ${productName}
  # Uninstalling keeps settings, history and the speech model: a reinstall
  # picks up where the user left off. They are removed by hand, and the
  # website's FAQ says where.
  deleteAppDataOnUninstall: false
  license: resources/eula.txt

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # The hardened runtime is what notarisation requires. The two memory
  # entitlements are Electron's; library validation has to be relaxed because
  # koffi dlopens system frameworks for the foreground checks.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    # The only permission macOS takes a purpose string for. Accessibility and
    # Input Monitoring are granted from their own privacy panes and show no
    # custom text; the app links to those panes instead.
    NSMicrophoneUsageDescription: >-
      Vocette records from your microphone only while you hold or press your
      dictation shortcut, and sends that recording to the transcription provider
      you configured.
  # Signing and notarisation are configured but deliberately not credentialled.
  # Set CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID in the environment, then flip this to true, to produce a
  # signed and notarised build. Left as it is, electron-builder produces an
  # unsigned app — see SECURITY.md.
  notarize: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  category: Utility;AudioVideo;
  maintainer: Vocette
  synopsis: Push-to-talk dictation with your own transcription API key
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # The desktop file name has to match `app.setDesktopName` in the main
  # process, or the Wayland global-shortcut portal cannot identify the app.
  executableName: murmur
  desktop:
    entry:
      Name: Vocette
      Comment: Push-to-talk dictation
      Categories: Utility;AudioVideo;
      # Electron derives WM_CLASS from the executable name; without this the
      # window is not associated with its launcher icon.
      StartupWMClass: murmur

deb:
  # X11 target verification calls into libX11 through koffi. It is already
  # pulled in by Electron, but naming it makes the dependency explicit.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libx11-6
