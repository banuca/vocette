<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; child-src 'none'"
    />
    <title>Vocette</title>
    <script type="module" src="./overlay.ts"></script>
  </head>
  <body>
    <!--
      Deliberately its own entry point. The overlay used to load the whole
      settings/history app just to draw this pill, which meant a second full
      renderer process running the entire UI.
    -->
    <div class="overlay idle" id="overlay" role="status" aria-live="polite">
      <div class="voice-visual" aria-hidden="true">
        <span class="waveform waveform-left">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="state-badge">
          <svg class="state-icon" viewBox="0 0 24 24" fill="none">
            <g class="icon icon-microphone">
              <rect x="9" y="4" width="6" height="10" rx="3" />
              <path d="M6.75 11.5a5.25 5.25 0 0 0 10.5 0M12 16.75V20M9.5 20h5" />
            </g>
            <g class="icon icon-document">
              <rect x="7" y="4.5" width="10" height="15" rx="2" />
              <path d="M9.5 9h5M9.5 12h5M9.5 15h3.25" />
            </g>
            <path class="icon icon-check" d="m6.5 12.25 3.4 3.4 7.6-8" />
            <g class="icon icon-error">
              <path d="M12 7.25v6.25" />
              <path d="M12 16.75h.01" />
            </g>
          </svg>
        </span>
        <span class="waveform waveform-right">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
      </div>
      <div class="copy">
        <div class="message" id="message">Ready</div>
        <div class="detail" id="detail"></div>
      </div>
      <div class="readout">
        <!--
          The live level while recording: five bars, or one dot that brightens
          where motion is reduced. Hidden from assistive technology, which is
          already told what is happening by the message.
        -->
        <span class="level" id="level" aria-hidden="true">
          <i class="level-bar"></i>
          <i class="level-bar"></i>
          <i class="level-bar"></i>
          <i class="level-bar"></i>
          <i class="level-bar"></i>
          <i class="level-dot" id="level-dot"></i>
        </span>
        <div class="timer" id="timer"></div>
      </div>
    </div>
  </body>
</html>
